<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>

    <link rel="stylesheet" href="css.css">

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <p>Juan Felipe Roncancio Fonseca</p>
    </header>

    <main class="container">

        <h1>LISTA DE TAREAS</h1>

        <section class="search">
            <form>
                <input type="text" placeholder="Agregar tarea..." required>
                <button class="btn-add">+</button>
            </form>
        </section>

        <section class="li-container">
            <ul>
                <!-- Las tareas se agregarán aquí -->
            </ul>
        </section>

        <section class="empty">
            <p>No hay tareas pendientes.</p>
        </section>

    </main>

    <footer>
        <h3>Como buena persona recursiva, si se pierde utilice el siguiente botón</h3>
        <p>Hecho por Juan Felipe Roncancio Fonseca</p>
        <a href="/html/recibidor.html">REUBICARSE</a>
    </footer>

    <script src="./js.js"></script>

</body>

</html>
